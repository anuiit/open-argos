[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "open-argos"
dynamic = ["version"]
description = "Bounded multi-provider review, planning, council, and research workflows for coding agents"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "open-argos contributors" },
]
keywords = ["ai", "agents", "codex", "claude-code", "mcp", "review"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Quality Assurance",
]
[project.urls]
Homepage = "https://github.com/anuiit/open-argos"
Documentation = "https://github.com/anuiit/open-argos#readme"
Issues = "https://github.com/anuiit/open-argos/issues"
Source = "https://github.com/anuiit/open-argos"

[project.scripts]
argos = "argos.argos:cli_main"
argos-mcp = "argos.mcp_launcher:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.dynamic]
version = { attr = "argos._version.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["argos"]
